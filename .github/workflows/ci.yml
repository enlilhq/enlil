name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Non-blocking: report formatting drift without failing the build.
      - name: Format check
        run: cargo fmt --all -- --check
        continue-on-error: true

      # Hard gate: lint must be clean.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Hard gate: the full suite. No external services required.
      - name: Test
        run: cargo test --verbose

  overhead:
    name: Governance overhead budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Enforces the per-request overhead budget on an optimized build, so a
      # regression in the hot path fails the PR rather than shipping quietly.
      - name: Proxy overhead benchmark
        run: cargo test --release --test proxy_overhead_bench -- --nocapture

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Fails the build on any advisory that is reachable from a real build.
      #
      # cargo audit reads Cargo.lock, which is feature-agnostic, so advisories
      # that only the optional `lambda` feature can reach are listed as explicit,
      # documented exceptions in .cargo/audit.toml rather than silently skipped.
      # Each one records why it is unreachable and what would retire it.
      - name: Audit dependencies
        run: cargo audit --deny warnings

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
