[package]
name = "enlil"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Vendor-neutral open-source control and audit plane for AI agent actions. Sits inline between your agents and any model or tool: enforce what each agent may do, and prove what it did."
authors = ["Samji Technologies Private Limited"]
license = "BUSL-1.1"
readme = "README.md"
repository = "https://github.com/enlilhq/enlil"
homepage = "https://enlil.samji.in"
documentation = "https://docs.rs/enlil"
keywords = ["ai", "agents", "security", "proxy", "observability"]
categories = ["web-programming::http-server", "network-programming"]
exclude = ["data/", "*.db"]

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
blake3 = "1.8.5"
bytes = "1.11.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1.0"
futures-util = "0.3.32"
http-body-util = "0.1.3"
lazy_static = "1.5.0"
moka = { version = "0.12.15", features = ["future", "sync"] }
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Optional DynamoDB trace backend. Off by default — the default build stores traces
# in local SQLite and pulls in no AWS dependencies.
aws-config = { version = "1.8.18", optional = true }
aws-sdk-dynamodb = { version = "1.116.0", optional = true }

[features]
default = []
# Enables the DynamoDB-backed trace store, for environments where the local
# filesystem is not durable (e.g. AWS Lambda).
lambda = ["aws-config", "aws-sdk-dynamodb"]

[[bin]]
name = "enlil"
path = "src/bin/enlil.rs"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
